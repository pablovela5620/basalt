[workspace]
name = "basalt"
version = "0.1.0"
description = "Pixi-only build of Basalt VIO/SLAM (C++ reference) — fixture for the Basalt-Mojo port"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

# ---------------------------------------------------------------------------
# IMPORTANT (numerical reproducibility): Eigen, Sophus and cereal are NOT taken
# from conda-forge. The build is pinned to the BUNDLED Eigen 5.0.1 / Sophus /
# cereal under thirdparty/basalt-headers/thirdparty/* (EIGEN_ROOT). Run the
# `submodules` task (git submodule update --init --recursive) before configuring.
#
# PLATFORMS: linux-64 + osx-arm64 (Apple Silicon). Everything resolves from
# conda-forge. On macOS the only non-pixi prerequisite is the Xcode Command Line
# Tools (the macOS SDK / system OpenGL+Cocoa frameworks) that conda's clang and
# Pangolin link against — Apple does not redistribute the SDK via conda. The
# Linux GL/X11/Wayland/mold packages below are gated to linux-64 because macOS
# uses Cocoa + the system OpenGL framework (no X11/Wayland/mesa, no mold).
# ---------------------------------------------------------------------------

[dependencies]
# --- toolchain (Linux: gcc+libstdc++ / macOS: clang+libc++, both from conda) ---
cxx-compiler = ">=1.7"
c-compiler = ">=1.7"
cmake = ">=3.24,<4"  # project targets CMake 3.x; CMake 4.x rejects opengv/Pangolin source-dir include paths
ninja = "*"
pkg-config = "*"
git = "*"
huggingface_hub = ">=1.22,<2"  # `hf` CLI for the public Monado SLAM datasets
unzip = "*"
ffmpeg = "*"         # libav headers/libraries and CLI for native RoboCap H.264 input
pyyaml = "*"         # Kalibr YAML input for the RoboCap calibration converter
tyro = "*"           # typed CLI for repository Python tools

# --- core libraries required by find_package() (cross-platform) ---
tbb-devel = "*"     # find_package(TBB): headers + libs (oneTBB)
libopencv = ">=4.5,<5" # OpenCV core/imgproc/calib3d/highgui; Basalt targets OpenCV 2/3/4 (not 5) — keep both platforms on 4.x
fmt = "8.*"         # pinned to the version Basalt/Sophus are tested against (FMT_DEPRECATED_OSTREAM workaround)

# --- rosbag2 (enabled when yaml-cpp + sqlite found) + rosbag1 transitive deps ---
yaml-cpp = "*"
sqlite = "*"
libboost-devel = "*"  # only used transitively by ROS1 rosbag (thirdparty/ros)
lz4-c = "*"
bzip2 = "*"

# --- GL loading for Pangolin (cross-platform) ---
glew = "*"
epoxy = "*"
# Pangolin (pango_geometry) does its own find_package(Eigen3) needing an Eigen3Config.cmake.
# conda-forge eigen is 5.0.1 — IDENTICAL to the bundled Eigen — so this just makes Eigen3
# discoverable hermetically (no reliance on a system Eigen3); Basalt still uses the bundled
# copy via EIGEN_ROOT. Without this, configure only worked where a system Eigen3 happened to exist.
eigen = "5.0.1.*"
librerun-sdk = "0.36.*"
rerun-sdk = "0.36.*"

[target.linux.dependencies]
# Linux-only: faster linker + the X11/Wayland/Mesa GL stack Pangolin needs on Linux.
# macOS uses the system OpenGL.framework + Cocoa windowing instead, so none of these apply.
mold = "*"             # auto-detected by CMake (-fuse-ld=mold); Linux ELF only
libgl-devel = "*"
libegl-devel = "*"
libopengl-devel = "*"
mesalib = "*"
wayland = "*"
wayland-protocols = "*"
libxkbcommon = "*"
xorg-libx11 = "*"
xorg-libxrandr = "*"
xorg-libxi = "*"
xorg-libxcursor = "*"
xorg-libxinerama = "*"
xorg-libxext = "*"
xorg-libxfixes = "*"

[tasks]
# 1) fetch all vendored deps (basalt-headers + nested Eigen5.0.1/Sophus/cereal, opengv, Pangolin, apriltag, ros, fastcdr, CLI11, magic_enum)
submodules = "git submodule update --init --recursive"

# 2) configure with the 'development' preset (RelWithDebInfo, all executables incl. basalt_vio).
#    CMAKE_PREFIX_PATH=$CONDA_PREFIX makes find_package() resolve TBB/OpenCV/fmt/yaml-cpp/SQLite3 to the pixi env.
configure = "cmake --preset development -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DBUILD_PANGOLIN_LIBRAW=OFF"

# 3) build the standalone VIO runner (pulls basalt_internal + Pangolin/opengv/apriltag/ros/fastcdr as needed)
build = "cmake --build build --target basalt_vio -j"

# build everything (lib + all executables)
build-all = "cmake --build build -j"

# 4) run headless VIO on a Monado/EuRoC-layout dataset, e.g.:
#    pixi run moo09-rerun
configure-then-build = { depends-on = ["configure", "build"] }
moo09-rerun = { cmd = "./build/basalt_vio --show-gui 0 --dataset-path datasets/MOO09_short_1_updown --dataset-type euroc --cam-calib data/msd/msdmo_calib.json --config-path data/msd/msdmo_config.json --deterministic 1 --rerun-rrd datasets/MOO09_short_1_updown/basalt_vio_moo09.rrd --save-trajectory tum --save-trajectory-fn datasets/MOO09_short_1_updown/basalt_vio_trajectory.txt", depends-on = ["configure-then-build"] }
moo09-view = "rerun datasets/MOO09_short_1_updown/basalt_vio_moo09.rrd"
mgo09-download = "hf download collabora/monado-slam-datasets M_monado_datasets/MG_reverb_g2/MGO_others/MGO09_short_1_updown.zip M_monado_datasets/MG_reverb_g2/extras/calibration.kb4.json --repo-type dataset --local-dir datasets/.hf-downloads"
mgo09-extract = { cmd = "unzip -qn datasets/.hf-downloads/M_monado_datasets/MG_reverb_g2/MGO_others/MGO09_short_1_updown.zip -d datasets", depends-on = ["mgo09-download"] }
mgo09-rerun = { cmd = "./build/basalt_vio --show-gui 0 --dataset-path datasets/MGO09_short_1_updown --dataset-type euroc --cam-calib datasets/.hf-downloads/M_monado_datasets/MG_reverb_g2/extras/calibration.kb4.json --config-path data/msd/msdmo_config.json --deterministic 1 --rerun-rrd datasets/MGO09_short_1_updown/basalt_vio_mgo09.rrd --save-trajectory tum --save-trajectory-fn datasets/MGO09_short_1_updown/basalt_vio_trajectory.txt", depends-on = ["configure-then-build", "mgo09-extract"] }
mgo09-blueprint = "python scripts/rerun/mgo09_blueprint.py"
mgo09-blueprint-test = "python -m unittest discover -s test -p 'test_rerun_blueprint.py'"
mgo09-view = { cmd = "rerun --new datasets/MGO09_short_1_updown/basalt_vio_mgo09.rrd datasets/MGO09_short_1_updown/basalt_vio_mgo09.rbl", depends-on = ["mgo09-blueprint"] }

# Native offline RoboCap input. Arguments after `--` are forwarded to the
# calibration converter, e.g. `pixi run robocap-calib -- --help`.
robocap-calib = "python scripts/basalt_convert_robocap_calib.py"
robocap-calib-test = "python -m unittest discover -s test -p 'test_robocap_calibration.py' -v"
robocap-dataset-test-build = { cmd = "cmake --build build --target test_robocap_dataset -j", depends-on = ["configure"] }
robocap-dataset-test = { cmd = "./build/test/test_robocap_dataset --gtest_color=no", depends-on = ["robocap-dataset-test-build"] }
robocap-test = { depends-on = ["robocap-calib-test", "robocap-dataset-test"] }
