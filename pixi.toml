[workspace]
name = "basalt"
version = "0.1.0"
description = "Pixi-only build of Basalt VIO/SLAM (C++ reference) — fixture for the Basalt-Mojo port"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

# ---------------------------------------------------------------------------
# IMPORTANT (numerical reproducibility): Eigen, Sophus and cereal are NOT taken
# from conda-forge. The build is pinned to the BUNDLED Eigen 5.0.1 / Sophus /
# cereal under thirdparty/basalt-headers/thirdparty/* (EIGEN_ROOT). The `_submodules`
# task (git submodule update --init --recursive) fetches them before configuring.
#
# PLATFORMS: linux-64 + linux-aarch64 + osx-arm64 (Apple Silicon). Everything
# resolves from conda-forge. On macOS the only non-pixi prerequisite is the
# Xcode Command Line Tools (the macOS SDK / system OpenGL+Cocoa frameworks) that
# conda's clang and Pangolin link against — Apple does not redistribute the SDK
# via conda. The GL/X11/Wayland/mold packages below are gated to Linux because
# macOS uses Cocoa + the system OpenGL framework (no X11/Wayland/mesa, no mold).
# ---------------------------------------------------------------------------

[dependencies]
# --- toolchain (Linux: gcc+libstdc++ / macOS: clang+libc++, both from conda) ---
cxx-compiler = ">=1.7"
c-compiler = ">=1.7"
cmake = ">=3.24,<4"  # project targets CMake 3.x; CMake 4.x rejects opengv/Pangolin source-dir include paths
ninja = "*"
pkg-config = "*"
git = "*"
huggingface_hub = ">=1.22,<2"  # `hf` CLI for the public Monado SLAM datasets
unzip = "*"
ffmpeg = "*"         # libav headers/libraries and CLI for native RoboCap H.264 input
pyyaml = "*"         # Kalibr YAML input for the RoboCap calibration converter
tyro = "*"           # typed CLI for repository Python tools

# --- core libraries required by find_package() (cross-platform) ---
tbb-devel = "*"     # find_package(TBB): headers + libs (oneTBB)
libopencv = ">=4.5,<5" # OpenCV core/imgproc/calib3d/highgui; Basalt targets OpenCV 2/3/4 (not 5) — keep both platforms on 4.x
fmt = "8.*"         # pinned to the version Basalt/Sophus are tested against (FMT_DEPRECATED_OSTREAM workaround)

# --- rosbag2 (enabled when yaml-cpp + sqlite found) + rosbag1 transitive deps ---
yaml-cpp = "*"
sqlite = "*"
libboost-devel = "*"  # only used transitively by ROS1 rosbag (thirdparty/ros)
lz4-c = "*"
bzip2 = "*"

# --- GL loading for Pangolin (cross-platform) ---
glew = "*"
epoxy = "*"
# Pangolin (pango_geometry) does its own find_package(Eigen3) needing an Eigen3Config.cmake.
# conda-forge eigen is 5.0.1 — IDENTICAL to the bundled Eigen — so this just makes Eigen3
# discoverable hermetically (no reliance on a system Eigen3); Basalt still uses the bundled
# copy via EIGEN_ROOT. Without this, configure only worked where a system Eigen3 happened to exist.
eigen = "5.0.1.*"
librerun-sdk = "0.36.*"
rerun-sdk = "0.36.*"

[target.linux.dependencies]
# Linux-only: faster linker + the X11/Wayland/Mesa GL stack Pangolin needs on Linux.
# macOS uses the system OpenGL.framework + Cocoa windowing instead, so none of these apply.
mold = "*"             # auto-detected by CMake (-fuse-ld=mold); Linux ELF only
libgl-devel = "*"
libegl-devel = "*"
libopengl-devel = "*"
mesalib = "*"
wayland = "*"
wayland-protocols = "*"
libxkbcommon = "*"
xorg-libx11 = "*"
xorg-libxrandr = "*"
xorg-libxi = "*"
xorg-libxcursor = "*"
xorg-libxinerama = "*"
xorg-libxext = "*"
xorg-libxfixes = "*"

# ---------------------------------------------------------------------------
# TASKS. Visible tasks are the ones that make sense to run on their own;
# `_`-prefixed tasks are chained intermediaries (hidden from `pixi task list`).
#
#   pixi run build          — fetch submodules, configure, compile basalt_vio
#   pixi run robocap        — RoboCap demo: build + download + VIO + Rerun viewer
#                             (`pixi run robocap stereo` = front pair only)
#   pixi run msd            — same for Monado SLAM; args pick the dataset:
#                             pixi run msd MOO09_short_1_updown MO_odyssey_plus MOO_others
#   pixi run robocap-calib  — RoboCap factory calibration -> Basalt JSONs
#   pixi run robocap-test   — calibration + dataset reader + blueprint tests
# ---------------------------------------------------------------------------

[tasks]
# Vendored deps (basalt-headers + nested Eigen5.0.1/Sophus/cereal, opengv, Pangolin, apriltag, ros, fastcdr, CLI11, magic_enum).
_submodules = "git submodule update --init --recursive"
# 'development' preset (RelWithDebInfo, all executables). CMAKE_PREFIX_PATH=$CONDA_PREFIX
# makes find_package() resolve TBB/OpenCV/fmt/yaml-cpp/SQLite3 to the pixi env.
# BASALT_BUILD_TESTS only adds test targets; `build` still compiles just basalt_vio.
_configure = { cmd = "cmake --preset development -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DBUILD_PANGOLIN_LIBRAW=OFF -DBASALT_BUILD_TESTS=ON", depends-on = ["_submodules"] }
# The standalone VIO runner (pulls basalt_internal + Pangolin/opengv/apriltag/ros/fastcdr as needed).
build = { cmd = "cmake --build build --target basalt_vio -j", depends-on = ["_configure"], description = "Fetch submodules, configure, and compile basalt_vio" }
# Everything (lib + all executables): `pixi run _build-all`.
_build-all = { cmd = "cmake --build build -j", depends-on = ["_configure"] }

# Shared Rerun layout for any basalt_vio recording; camera views match the calibration.
_blueprint = { cmd = "python scripts/rerun/basalt_vio_blueprint.py --output {{ output }} --calibration {{ calibration }}", args = ["output", "calibration"] }

# --- Monado SLAM demo (EuRoC layout, downloaded from collabora/monado-slam-datasets) ---
_msd-download = { cmd = "hf download collabora/monado-slam-datasets M_monado_datasets/{{ group }}/{{ subgroup }}/{{ name }}.zip M_monado_datasets/{{ group }}/extras/calibration.kb4.json --repo-type dataset --local-dir datasets/monado-slam-datasets", args = ["name", "group", "subgroup"] }
_msd-extract = { cmd = "unzip -qn datasets/monado-slam-datasets/M_monado_datasets/{{ group }}/{{ subgroup }}/{{ name }}.zip -d datasets", args = ["name", "group", "subgroup"], depends-on = [{ task = "_msd-download", args = ["{{ name }}", "{{ group }}", "{{ subgroup }}"] }] }
_msd-vio = { cmd = "./build/basalt_vio --show-gui 0 --dataset-path datasets/{{ name }} --dataset-type euroc --cam-calib datasets/monado-slam-datasets/M_monado_datasets/{{ group }}/extras/calibration.kb4.json --config-path data/msd/msdmo_config.json --deterministic 1 --rerun-rrd datasets/{{ name }}/basalt_vio.rrd --save-trajectory tum --save-trajectory-fn datasets/{{ name }}/basalt_vio_trajectory.txt", args = ["name", "group", "subgroup"], depends-on = ["build", { task = "_msd-extract", args = ["{{ name }}", "{{ group }}", "{{ subgroup }}"] }] }

[tasks.msd]
description = "Monado SLAM demo: build + download + VIO + Rerun viewer (args: name group subgroup, default MGO09)"
args = [
  { arg = "name", default = "MGO09_short_1_updown" },
  { arg = "group", default = "MG_reverb_g2" },
  { arg = "subgroup", default = "MGO_others" },
]
cmd = "rerun --new datasets/{{ name }}/basalt_vio.rrd datasets/{{ name }}/basalt_vio.rbl"
depends-on = [
  { task = "_msd-vio", args = ["{{ name }}", "{{ group }}", "{{ subgroup }}"] },
  { task = "_blueprint", args = [
    "datasets/{{ name }}/basalt_vio.rbl",
    "datasets/monado-slam-datasets/M_monado_datasets/{{ group }}/extras/calibration.kb4.json",
  ] },
]

[tasks._robocap-download]
# Session 15 + converted calibrations only (the repo also holds session 14 and raw kalibr files).
cmd = "hf download pablovela5620/robocap-example f408193e6447b3b0_session_15/ 0factory-calibration-f408193e6447b3b0/robocap-basalt-calib.json 0factory-calibration-f408193e6447b3b0/robocap-basalt-calib-stereo.json --repo-type dataset --local-dir datasets/robocap-example"

[tasks._robocap-vio]
# variant "coverage" = all four cameras; "stereo" = the front pair only.
args = [{ arg = "variant", default = "coverage" }]
cmd = './build/basalt_vio --show-gui 0 --dataset-type robocap{{ "-stereo" if variant == "stereo" else "" }} --dataset-path datasets/robocap-example/f408193e6447b3b0_session_15 --cam-calib datasets/robocap-example/0factory-calibration-f408193e6447b3b0/robocap-basalt-calib{{ "-stereo" if variant == "stereo" else "" }}.json --config-path data/msd/msdmo_config.json --deterministic 1 --rerun-rrd datasets/robocap_session_15{{ "_stereo" if variant == "stereo" else "" }}.rrd --save-trajectory tum --save-trajectory-fn datasets/robocap_session_15{{ "_stereo" if variant == "stereo" else "" }}_trajectory.txt'
depends-on = ["build", "_robocap-download"]

[tasks.robocap]
# The one-command RoboCap demo: build + download + VIO + Rerun viewer.
# `pixi run robocap` = four coverage cameras; `pixi run robocap stereo` = front pair.
description = "RoboCap demo: build + download + VIO + Rerun viewer ('robocap stereo' = front pair only)"
args = [{ arg = "variant", default = "coverage" }]
cmd = 'rerun --new datasets/robocap_session_15{{ "_stereo" if variant == "stereo" else "" }}.rrd datasets/robocap_session_15{{ "_stereo" if variant == "stereo" else "" }}.rbl'
depends-on = [
  { task = "_robocap-vio", args = ["{{ variant }}"] },
  { task = "_blueprint", args = [
    'datasets/robocap_session_15{{ "_stereo" if variant == "stereo" else "" }}.rbl',
    'datasets/robocap-example/0factory-calibration-f408193e6447b3b0/robocap-basalt-calib{{ "-stereo" if variant == "stereo" else "" }}.json',
  ] },
]

[tasks.robocap-calib]
# Native offline RoboCap input. Arguments after `--` are forwarded to the
# calibration converter, e.g. `pixi run robocap-calib -- --help`.
description = "Convert a RoboCap factory calibration to Basalt JSONs (coverage + stereo)"
cmd = "python scripts/basalt_convert_robocap_calib.py"

[tasks._robocap-calib-test]
cmd = "python -m unittest discover -s test -p 'test_robocap_calibration.py' -v"

[tasks._robocap-dataset-test-build]
cmd = "cmake --build build --target test_robocap_dataset -j"
depends-on = ["_configure"]

[tasks._robocap-dataset-test]
cmd = "./build/test/test_robocap_dataset --gtest_color=no"
depends-on = ["_robocap-dataset-test-build"]

[tasks._blueprint-test]
cmd = "python -m unittest discover -s test -p 'test_rerun_blueprint.py'"

[tasks.robocap-test]
description = "Run the RoboCap adapter tests: calibration + dataset reader + blueprint"
depends-on = ["_robocap-calib-test", "_robocap-dataset-test", "_blueprint-test"]

# ---------------------------------------------------------------------------
# VIT driver: Python feed for libbasalt's VIT C API (python/*.py).
# Separate env so the Python feed's deps (PyAV, later torch + the rerun
# dataloader extra) stay out of the C++ build env. rerun stays 0.36 here,
# consistent with the repo's C++/blueprint pins.
# ---------------------------------------------------------------------------
[feature.driver]
platforms = ["linux-64"]

[feature.driver.system-requirements]
cuda = "12"

[feature.driver.dependencies]
python = "3.12.*"
numpy = "*"
av = "*"
pyyaml = "*"
tyro = "*"
pytorch-gpu = "*"
torchcodec = "*"
pyarrow = "*"
jaxtyping = ">=0.3.11,<0.4"

[feature.driver.pypi-dependencies]
rerun-sdk = { version = "==0.36.*", extras = ["datafusion"] }

# TODO(gates): the golden csv is a machine-local artifact from the original
# basalt_vio spike run; regenerate it via _robocap-vio (needs a TUM->ns/qw-first
# converter) to make these gates runnable from a clean checkout.
[feature.driver.tasks._build-norerun]
cmd = "cmake --preset development -B build-norerun -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DBUILD_PANGOLIN_LIBRAW=OFF -DBASALT_ENABLE_RERUN=OFF && cmake --build build-norerun --target basalt -j"

[feature.driver.tasks.vit-golden]
description = "Step-A gate: file-fed VIT driver vs the basalt_vio golden trajectory (binding fidelity, 5 cm)"
cmd = "python python/drive_files.py --lib build-norerun/libbasalt.so --output datasets/vit_files_trajectory.csv && python python/golden_compare.py /tmp/robocap-slam-test/traj_s15_vga.csv datasets/vit_files_trajectory.csv"
depends-on = ["_build-norerun"]

[feature.driver.tasks.vit-golden-catalog]
# 10 cm: the NVDEC+RGB-roundtrip pixels differ from swscale gray8 by ~0.5 LSB,
# which deterministic VIO amplifies to a few cm of ATE over a session. Frameset
# timestamps agree with the file reader to 1 ns; the gap is decode-path only.
description = "Step-B gate: catalog+NVDEC VIT driver vs the golden trajectory (decoder equivalence, 10 cm)"
args = [{ arg = "rrd" }]
cmd = "python python/drive_catalog.py --lib build-norerun/libbasalt.so --vit-config python/robocap_vit.toml --rrd {{ rrd }} --output datasets/vit_catalog_trajectory.csv && python python/golden_compare.py /tmp/robocap-slam-test/traj_s15_vga.csv datasets/vit_catalog_trajectory.csv --tolerance-m 0.10"
depends-on = ["_build-norerun"]

[environments]
driver = { features = ["driver"], no-default-feature = true }
